<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>67 Clicker · ripple & gradient</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      user-select: none;
      -webkit-user-select: none;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* falling background layer */
    #bg67 {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg67-item {
      position: absolute;
      top: -10vh;
      font-weight: 900;
      color: #f9d423;
      opacity: 0.5;
      white-space: nowrap;
      user-select: none;
      will-change: transform;
    }

    /* title container — scales to device width */
    h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(36px, 12vw, 96px);
      letter-spacing: 4px;
      margin-bottom: clamp(28px, 8vw, 48px);
      display: inline-block;
      max-width: 100%;
      line-height: 1.15;
    }

    /* each letter ripples individually, with a pause between waves */
    h1 .char {
      display: inline-block;
      animation: rippleChar 2.4s ease-in-out infinite;
      will-change: transform;
    }

    /* ripple: bounce up quickly, return, then rest for the remainder */
    @keyframes rippleChar {
      0%   { transform: translateY(0) scale(1); }
      12%  { transform: translateY(-10px) scale(1.06); }
      25%  { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }

    #startBtn {
      position: relative;
      z-index: 1;
      padding: clamp(14px, 4vw, 18px) clamp(36px, 12vw, 64px);
      font-size: clamp(18px, 5vw, 22px);
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b 70%);
      border: 3px solid #f9d423;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(249, 212, 35, 0.35);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      max-width: 90vw;
    }
    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(249, 212, 35, 0.7);
    }
    #startBtn:active { transform: scale(0.96); }

    /* respect reduced motion preferences (ripple) */
    @media (prefers-reduced-motion: reduce) {
      h1 .char { animation: none; }
    }
  </style>
</head>
<body>

  <div id="bg67" aria-hidden="true"></div>
  <h1 id="title">67 CLICKER</h1>
  <button id="startBtn" onclick="location.href='game.html'">START</button>

  <script>
    (function() {
      // ----- 1. SPLIT TITLE INTO LETTERS -----
      const h1 = document.getElementById('title');
      const text = h1.textContent;
      h1.textContent = '';

      const spans = [];
      for (const ch of text) {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = ch === ' ' ? '\u00A0' : ch;
        h1.appendChild(span);
        spans.push(span);
      }

      // ----- 2. APPLY SHARED CONTINUOUS GRADIENT -----
      // Reassigns background slices and (only the first time) animation delays,
      // so a resize doesn't restart the ripple wave (fix #2).
      let gradientApplied = false;

      function applyGradient() {
        requestAnimationFrame(() => {
          const h1Rect = h1.getBoundingClientRect();
          const totalWidth = h1Rect.width;
          if (totalWidth === 0) return;

          spans.forEach((span, index) => {
            const spanRect = span.getBoundingClientRect();
            const leftOffset = spanRect.left - h1Rect.left;

            span.style.backgroundImage = 'linear-gradient(90deg, #f9d423, #ff4e50)';
            span.style.backgroundSize = `${totalWidth}px 100%`;
            span.style.backgroundPosition = `-${leftOffset}px 0`;
            span.style.webkitBackgroundClip = 'text';
            span.style.backgroundClip = 'text';
            span.style.color = 'transparent';

            // Only set the stagger delay once, so resize/orientation changes
            // don't restart the wave (fix #2).
            if (!gradientApplied) {
              span.style.animationDelay = `${index * 0.12}s`;
            }
          });

          gradientApplied = true;
        });
      }

      // ----- 1. FONT-READY SAFETY NET (fix #1) -----
      // Apply as soon as fonts are ready, but guarantee the gradient is applied
      // even if document.fonts.ready never resolves (some in-app browsers).
      let applied = false;
      function ensureGradient() {
        if (applied) return;
        applied = true;
        applyGradient();
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(ensureGradient).catch(ensureGradient);
      }
      // Fallback: apply regardless after a short delay if fonts never resolve.
      setTimeout(ensureGradient, 1500);

      // Re-apply on resize/orientation change so the gradient stays aligned.
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(applyGradient, 120);
      });

      // ----- 3 & 4. FALLING 67s (reduced-motion + WAAPI guard) -----
      (function falling67() {
        // Respect reduced-motion: skip the falling background entirely (fix #3).
        const prefersReduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced) return;

        // Guard: if Web Animations API is unavailable, skip the background
        // instead of throwing and leaving a console error (fix #4).
        const testEl = document.createElement('div');
        if (typeof testEl.animate !== 'function') return;

        const layer = document.getElementById('bg67');
        const count = window.innerWidth < 600 ? 26 : 60;
        const anims = [];

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'bg67-item';
          el.textContent = '67';

          const size     = 18 + Math.random() * 60;
          const duration = 6 + Math.random() * 14;
          const delay    = -Math.random() * duration;
          const drift    = (Math.random() - 0.5) * 120;
          const startRot = Math.random() * 360;
          const spin     = (Math.random() - 0.5) * 360;
          const left     = Math.random() * 100;

          el.style.fontSize = size + 'px';
          el.style.left = left + 'vw';
          el.style.opacity = 0.5;

          const anim = el.animate(
            [
              { transform: `translate(0, -10vh) rotate(${startRot}deg)` },
              { transform: `translate(${drift}px, 110vh) rotate(${startRot + spin}deg)` }
            ],
            {
              duration: duration * 1000,
              delay: delay * 1000,
              iterations: Infinity,
              easing: 'linear'
            }
          );

          anims.push(anim);
          layer.appendChild(el);
        }

        // ----- 5. PAUSE FALLING ANIMATIONS WHEN TAB IS HIDDEN -----
        // Saves battery/CPU on mobile; resumes seamlessly on return.
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            for (const a of anims) a.pause();
          } else {
            for (const a of anims) a.play();
          }
        });
      })();
    })();
  </script>

</body>
</html>
