<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67 Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    user-select: none;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  /* Falling "67" background layer */
  #bg67 {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg67-item {
    position: absolute;
    top: -10vh;
    font-weight: 900;
    color: #f9d423;
    opacity: 0.5;
    white-space: nowrap;
    user-select: none;
    will-change: transform;
  }

  /* Rippling title */
  h1 {
    position: relative;
    z-index: 1;
    font-size: clamp(44px, 12vw, 96px);
    letter-spacing: 4px;
    margin-bottom: 48px;
    display: inline-block;
  }
  /* Each letter gets its own gradient + ripple so the wave looks smooth */
  h1 .char {
    display: inline-block;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: ripple 1.8s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes ripple {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-10px) scale(1.06); }
  }

  #startBtn {
    position: relative;
    z-index: 1;
    padding: 18px 64px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b 70%);
    border: 3px solid #f9d423;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(249, 212, 35, 0.35);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  #startBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(249, 212, 35, 0.7);
  }
  #startBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<!-- Falling 67 background (filled by script) -->
<div id="bg67" aria-hidden="true"></div>

<h1 id="title">67 CLICKER</h1>
<button id="startBtn" onclick="location.href='game.html'">START</button>

<script>
// ---- 1. Wrap each title character in a span so it can ripple individually ----
(function splitTitle() {
  const h1 = document.getElementById('title');
  const text = h1.textContent;
  h1.textContent = '';
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = ch === ' ' ? '\u00A0' : ch; // keep spaces visible
    // Stagger the animation so the ripple travels across the word
    span.style.animationDelay = (i * 0.09) + 's';
    h1.appendChild(span);
  });
})();

// ---- 2. Falling 67s with varied speed + slight spin ----
(function falling67() {
  const layer = document.getElementById('bg67');
  const count = 60; // matches the 1.5x density from before

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'bg67-item';
    el.textContent = '67';

    const size     = 18 + Math.random() * 60;      // 18–78px
    const duration = 6 + Math.random() * 14;       // 6–20s to fall (faster/slower)
    const delay    = -Math.random() * duration;    // negative delay = already mid-fall on load
    const drift    = (Math.random() - 0.5) * 120;  // horizontal drift in px
    const startRot = Math.random() * 360;          // starting angle
    const spin     = (Math.random() - 0.5) * 360;  // total rotation over the fall
    const left     = Math.random() * 100;          // start position across the screen

    el.style.fontSize = size + 'px';
    el.style.left = left + 'vw';
    el.style.opacity = 0.5;

    // Use a CSS custom animation per element so each has its own fall path
    el.animate(
      [
        { transform: `translate(0, -10vh) rotate(${startRot}deg)` },
        { transform: `translate(${drift}px, 110vh) rotate(${startRot + spin}deg)` }
      ],
      {
        duration: duration * 1000,
        delay: delay * 1000,
        iterations: Infinity,
        easing: 'linear'
      }
    );

    layer.appendChild(el);
  }
})();
</script>

</body>
</html>
