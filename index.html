<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67 Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    user-select: none;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  /* Scattered "67" background layer */
  #bg67 {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg67-item {
    position: absolute;
    font-weight: 900;
    color: #f9d423;
    opacity: 0.5;
    white-space: nowrap;
    user-select: none;
  }

  /* Foreground content sits above the scattered 67s */
  h1 {
    position: relative;
    z-index: 1;
    font-size: clamp(44px, 12vw, 96px);
    letter-spacing: 4px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 48px;
    animation: glow 2.5s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(249, 212, 35, 0.3)); }
    50%      { filter: drop-shadow(0 0 24px rgba(249, 212, 35, 0.7)); }
  }

  #startBtn {
    position: relative;
    z-index: 1;
    padding: 18px 64px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b 70%);
    border: 3px solid #f9d423;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(249, 212, 35, 0.35);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  #startBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(249, 212, 35, 0.7);
  }
  #startBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<!-- Scattered 67 background (filled by script) -->
<div id="bg67" aria-hidden="true"></div>

<h1>67 CLICKER</h1>
<button id="startBtn" onclick="location.href='game.html'">START</button>

<script>
  // Generate randomly oriented, randomly sized "67"s across the background
  (function scatter67() {
    const layer = document.getElementById('bg67');
    const count = 40; // how many 67s to scatter

    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'bg67-item';
      el.textContent = '67';

      const size = 18 + Math.random() * 60;          // 18px – 78px
      const rot  = Math.random() * 360;               // full 0–360° rotation

      el.style.fontSize = size + 'px';
      el.style.left = (Math.random() * 100) + 'vw';
      el.style.top  = (Math.random() * 100) + 'vh';
      el.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;

      layer.appendChild(el);
    }
  })();
</script>

</body>
</html>
