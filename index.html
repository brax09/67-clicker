<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67 Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    user-select: none;
    text-align: center;
  }
  h1 {
    font-size: clamp(44px, 12vw, 96px);
    letter-spacing: 4px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
    animation: glow 2.5s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(249, 212, 35, 0.3)); }
    50%      { filter: drop-shadow(0 0 24px rgba(249, 212, 35, 0.7)); }
  }
  .tagline {
    font-size: 15px;
    opacity: 0.65;
    letter-spacing: 1px;
    margin-bottom: 48px;
  }
  #startBtn {
    padding: 18px 64px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #c0392b 70%);
    border: 3px solid #f9d423;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 30px rgba(249, 212, 35, 0.35);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  #startBtn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 50px rgba(249, 212, 35, 0.7);
  }
  #startBtn:active { transform: scale(0.96); }
  .footer {
    position: fixed;
    bottom: 16px;
    font-size: 12px;
    opacity: 0.4;
  }
</style>
</head>
<body>

<h1>67 CLICKER</h1>
<p class="tagline">CLICK. UPGRADE. DOMINATE.</p>
<button id="startBtn" onclick="location.href='game.html'">START</button>

<div class="footer">Made with GitHub Pages</div>

</body>
</html>
