<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>67 Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 100%; overflow-x: hidden; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    overflow-y: auto;
    position: relative;
  }

  /* ---------- DESKTOP LAYOUT (≥900px) ---------- */
  @media (min-width: 900px) {
    body {
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "sidebar main"
        "sidebar footer";
      align-items: center;
      justify-items: center;
      padding: 0 392px 0 0;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    .stats {
      grid-area: main;
      align-self: start;
      margin-top: 40px;
    }

    #clickBtn {
      grid-area: main;
      align-self: center;
      margin: 0;
    }

    .shop {
      grid-area: sidebar;
      justify-self: start;
      align-self: center;
      max-width: 320px;
      width: 100%;
      margin: 0;
      padding: 24px 16px 24px 32px;
      overflow-y: auto;
      max-height: 90vh;
      /* hide scrollbar */
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .shop::-webkit-scrollbar { display: none; }

    .buttons-row {
      grid-area: footer;
      align-self: end;
      margin-bottom: 24px;
      margin-top: 0;
    }

    .ach-btn { display: none; }
  }

  .stats { text-align: center; margin-bottom: clamp(10px, 3vw, 18px); line-height: 1.6; }
  .score { font-size: clamp(24px, 7vw, 30px); font-weight: 800; color: #f9d423; }
  .per-click { font-size: 14px; opacity: 0.8; }
  .per-sec { font-size: 14px; opacity: 0.8; }

  #clickBtn {
    width: clamp(160px, 48vw, 260px);
    height: clamp(160px, 48vw, 260px);
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.07s ease;
    margin-bottom: clamp(16px, 5vw, 28px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #clickBtn:active { transform: scale(0.94); }
  #clickBtn.pulse { animation: pulse 0.25s ease; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  #clickBtn .big67 {
    font-size: clamp(110px, 34vw, 200px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -4px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: block;
    padding: 0 8px;
    user-select: none;
    pointer-events: none;
  }

  .shop {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .shop h2 { font-size: 18px; opacity: 0.85; margin-bottom: 2px; }
  #upgradeList { display: flex; flex-direction: column; gap: 10px; }

  .upgrade {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .upgrade:hover:not(.locked) { background: rgba(255,255,255,0.15); }
  .upgrade.locked { opacity: 0.45; cursor: not-allowed; }
  .upgrade .info { text-align: left; }
  .upgrade .name { font-weight: 700; }
  .upgrade .desc { font-size: 12px; opacity: 0.7; }
  .upgrade .cost { color: #f9d423; font-weight: 700; white-space: nowrap; }

  .buttons-row {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .reset, .ach-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.6);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .reset:hover, .ach-btn:hover { color: #fff; border-color: #fff; }
  .ach-btn { position: relative; }
  .ach-btn .badge-count {
    display: inline-block;
    background: #f9d423;
    color: #1a1a2e;
    font-weight: 800;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 8px;
    margin-left: 6px;
  }

  .float {
    position: fixed;
    pointer-events: none;
    font-weight: 900;
    color: #f9d423;
    font-size: 24px;
    animation: floatUp 0.8s ease-out forwards;
    z-index: 999;
  }
  @keyframes floatUp { to { transform: translateY(-80px); opacity: 0; } }

  #modalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #modalBackdrop.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #1f2544, #16213e);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal p { margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; }
  .modal button {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .modal .cancel { background: rgba(255,255,255,0.08); color: #fff; }
  .modal .confirm { background: #c0392b; color: #fff; border-color: #e74c3c; }
  .modal .cancel:hover { background: rgba(255,255,255,0.16); }
  .modal .confirm:hover { background: #d64535; }

  #achBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1100;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  #achBackdrop.open { opacity: 1; visibility: visible; }

  #achPanel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 380px;
    max-width: 92vw;
    background: linear-gradient(160deg, #1f2544, #16213e);
    border-left: 1px solid rgba(255,255,255,0.15);
    box-shadow: -10px 0 40px rgba(0,0,0,0.5);
    z-index: 1200;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  #achPanel.open { transform: translateX(0); }

  @media (min-width: 900px) {
    #achBackdrop { display: none !important; }
    #achPanel {
      transform: none !important;
      top: 12px;
      bottom: 12px;
      right: 12px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: none;
      width: 380px;
    }
    #achClose { display: none; }
  }

  .ach-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .ach-header h2 {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .ach-header .header-count {
    display: none;
    background: #f9d423;
    color: #1a1a2e;
    font-weight: 800;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  @media (min-width: 900px) {
    .ach-header .header-count { display: inline-block; }
  }
  .ach-close {
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    flex-shrink: 0;
  }
  .ach-close:hover { border-color: #fff; }

  .ach-summary { font-size: 13px; opacity: 0.85; margin-bottom: 8px; }
  .ach-summary .count { color: #f9d423; font-weight: 800; font-size: 16px; }

  .ach-progress {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 14px;
    flex-shrink: 0;
  }
  .ach-progress .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    transition: width 0.4s ease;
  }

  #achList {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 2px;
    -webkit-overflow-scrolling: touch;
    /* hide scrollbar */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #achList::-webkit-scrollbar { display: none; }

  .ach {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 12px;
    transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .ach.unlocked {
    border-color: rgba(249,212,35,0.5);
    background: rgba(249,212,35,0.08);
  }
  .ach .ach-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ach .icon {
    font-size: 22px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .ach.unlocked .icon { background: rgba(249,212,35,0.18); }
  .ach.locked .icon { filter: grayscale(1); opacity: 0.5; }
  .ach .info { flex: 1; min-width: 0; }
  .ach .name {
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .ach .badge {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #1a1a2e;
    background: #f9d423;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .ach .desc { font-size: 11px; opacity: 0.7; margin-top: 1px; }
  .ach .status { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.3); flex-shrink: 0; }
  .ach.unlocked .status { color: #f9d423; }

  .ach .bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .ach .bar {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }
  .ach .bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    transition: width 0.4s ease;
  }
  .ach .bar-label {
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
    min-width: 52px;
    text-align: right;
  }

  .ach-toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, calc(100% + 40px));
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    color: #1a1a2e;
    font-weight: 800;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 50px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 2000;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    max-width: 90vw;
    text-align: center;
    pointer-events: none;
    opacity: 0;
  }
  .ach-toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    #clickBtn.pulse { animation: none; }
    .float { animation-duration: 0.01s; }
    #achPanel { transition: none; }
    #achBackdrop { transition: none; }
    .ach-toast { transition: none; }
    .ach-progress .fill { transition: none; }
    .ach .bar .fill { transition: none; }
  }
</style>
</head>
<body>

<div class="stats">
  <div>67s: <span class="score" id="score">0</span></div>
  <div class="per-click">+<span id="perClick">1</span> per click</div>
  <div class="per-sec">+<span id="perSec">0</span> per second</div>
</div>

<button id="clickBtn"><span class="big67">67</span></button>

<div class="shop">
  <h2>Upgrades</h2>
  <div id="upgradeList"></div>
</div>

<div class="buttons-row">
  <button class="ach-btn" id="achBtn">Achievements <span class="badge-count" id="achBadge">0</span></button>
  <button class="reset" id="resetBtn">Reset game</button>
</div>

<div id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalText">
    <p id="modalText">Reset all progress? This cannot be undone.</p>
    <div class="actions">
      <button class="cancel" id="modalCancel">Cancel</button>
      <button class="confirm" id="modalConfirm">Reset</button>
    </div>
  </div>
</div>

<div id="achBackdrop"></div>
<aside id="achPanel" aria-hidden="true" aria-label="Achievements">
  <div class="ach-header">
    <h2>Achievements</h2>
    <span class="header-count" id="achHeaderCount">0</span>
    <button class="ach-close" id="achClose" aria-label="Close achievements">×</button>
  </div>
  <div class="ach-summary">
    Unlocked <span class="count" id="achUnlockedCount">0</span> / <span id="achTotalCount">0</span>
  </div>
  <div class="ach-progress"><div class="fill" id="achProgressFill"></div></div>
  <div id="achList"></div>
</aside>

<script>
const state = {
  score: 0,
  clickPower: 1,
  clickCount: 0,
  hasReset: false,
  upgrades: [
    { id: 'power',  name: 'Finger Strength', desc: '+1 per click',    baseCost: 10,  costMult: 1.12, level: 0 },
    { id: 'auto',   name: 'Auto-Clicker',    desc: '+1 per second',   baseCost: 25,  costMult: 1.15, level: 0 },
    { id: 'mega',   name: 'Mega 67',         desc: '+5 per click',    baseCost: 60,  costMult: 1.18, level: 0 },
    { id: 'turbo',  name: 'Turbo Bot',       desc: '+5 per second',   baseCost: 150, costMult: 1.20, level: 0 },
  ],
  autoPerSec: 0,
  lastTick: Date.now(),
};

const STORAGE_KEY = 'clicker67';
const ACH_KEY = 'clicker67_achievements';
let storageAvailable = true;

function safeGetItem(key) {
  try { return localStorage.getItem(key); }
  catch (e) { storageAvailable = false; return null; }
}
function safeSetItem(key, value) {
  if (!storageAvailable) return false;
  try { localStorage.setItem(key, value); return true; }
  catch (e) { storageAvailable = false; return false; }
}
function safeRemoveItem(key) {
  if (!storageAvailable) return;
  try { localStorage.removeItem(key); } catch (e) {}
}

const saved = safeGetItem(STORAGE_KEY);
if (saved) {
  try {
    const data = JSON.parse(saved);
    if (data && typeof data === 'object') {
      if (Number.isFinite(data.score) && data.score >= 0) state.score = data.score;
      if (Number.isFinite(data.clickPower) && data.clickPower > 0) state.clickPower = data.clickPower;
      if (Number.isFinite(data.autoPerSec) && data.autoPerSec >= 0) state.autoPerSec = data.autoPerSec;
      if (Number.isFinite(data.clickCount) && data.clickCount >= 0) state.clickCount = Math.floor(data.clickCount);
      if (data.hasReset === true) state.hasReset = true;

      if (Array.isArray(data.upgrades)) {
        const balanced = { power: 1.12, auto: 1.15, mega: 1.18, turbo: 1.20 };
        for (const savedUp of data.upgrades) {
          if (!savedUp || typeof savedUp.id !== 'string') continue;
          const target = state.upgrades.find(u => u.id === savedUp.id);
          if (!target) continue;
          if (Number.isFinite(savedUp.level) && savedUp.level >= 0) {
            target.level = Math.floor(savedUp.level);
          }
          if (balanced[target.id] !== undefined) target.costMult = balanced[target.id];
        }
      }
    }
    state.lastTick = Date.now();
  } catch (e) { console.warn('Save corrupted, starting fresh'); }
}

if (!Number.isFinite(state.score) || state.score < 0) state.score = 0;
if (!Number.isFinite(state.clickPower) || state.clickPower <= 0) state.clickPower = 1;

const $ = (id) => document.getElementById(id);
const scoreEl = $('score');
const perClickEl = $('perClick');
const perSecEl = $('perSec');
const listEl = $('upgradeList');
const clickBtn = $('clickBtn');

const costOf = (u) => Math.floor(u.baseCost * Math.pow(u.costMult, u.level));
const fmt = (n) => {
  if (!Number.isFinite(n)) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return Math.floor(n);
};

function recalc() {
  state.clickPower = 1
    + state.upgrades.find(u => u.id === 'power').level * 1
    + state.upgrades.find(u => u.id === 'mega').level * 5;
  state.autoPerSec =
      state.upgrades.find(u => u.id === 'auto').level * 1
    + state.upgrades.find(u => u.id === 'turbo').level * 5;
}

function render() {
  recalc();
  scoreEl.textContent = fmt(state.score);
  perClickEl.textContent = state.clickPower;
  perSecEl.textContent = state.autoPerSec;

  listEl.innerHTML = '';
  for (const u of state.upgrades) {
    const cost = costOf(u);
    const affordable = state.score >= cost;
    const div = document.createElement('div');
    div.className = 'upgrade' + (affordable ? '' : ' locked');
    div.dataset.id = u.id;
    div.innerHTML = `
      <div class="info">
        <div class="name">${u.name} <span style="opacity:.6">Lv.${u.level}</span></div>
        <div class="desc">${u.desc}</div>
      </div>
      <div class="cost">${fmt(cost)}</div>`;
    div.onclick = () => buy(u);
    listEl.appendChild(div);
  }

  save();
}

function updateScoreDisplay() { scoreEl.textContent = fmt(state.score); }

function buy(u) {
  const cost = costOf(u);
  if (state.score < cost) return;
  state.score -= cost;
  u.level++;
  render();
  checkAchievements();
}

let saveTimer = null;
const SAVE_THROTTLE_MS = 5000;
function saveNow() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  safeSetItem(STORAGE_KEY, JSON.stringify(state));
}
function save() {
  if (saveTimer) return;
  saveTimer = setTimeout(() => {
    saveTimer = null;
    safeSetItem(STORAGE_KEY, JSON.stringify(state));
  }, SAVE_THROTTLE_MS);
}
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveNow();
});

const ACHIEVEMENTS = [
  { id: 'first_click',   icon: '👆', name: 'First Tap',       desc: 'Click the 67 for the first time.',
    progress: s => ({ current: Math.min(s.clickCount || 0, 1), target: 1 }) },
  { id: 'clicks_100',    icon: '💯', name: 'Century Clicker', desc: 'Click 100 times.',
    progress: s => ({ current: Math.min(s.clickCount || 0, 100), target: 100 }) },
  { id: 'clicks_1000',   icon: '🔥', name: 'Thousand Taps',   desc: 'Click 1,000 times.',
    progress: s => ({ current: Math.min(s.clickCount || 0, 1000), target: 1000 }) },
  { id: 'score_100',     icon: '✨', name: 'Getting Started', desc: 'Reach 100 67s.',
    progress: s => ({ current: Math.min(Math.floor(s.score), 100), target: 100 }) },
  { id: 'score_1000',    icon: '💎', name: 'Four Figures',    desc: 'Reach 1,000 67s.',
    progress: s => ({ current: Math.min(Math.floor(s.score), 1000), target: 1000 }) },
  { id: 'score_10000',   icon: '👑', name: '67 Royalty',      desc: 'Reach 10,000 67s.',
    progress: s => ({ current: Math.min(Math.floor(s.score), 10000), target: 10000 }) },
  { id: 'first_upgrade', icon: '🛒', name: 'First Purchase',  desc: 'Buy your first upgrade.',
    progress: s => ({ current: s.upgrades.some(u => u.level > 0) ? 1 : 0, target: 1 }) },
  { id: 'auto_income',   icon: '⚙️', name: 'Automated',       desc: 'Earn passive income.',
    progress: s => ({ current: s.autoPerSec > 0 ? 1 : 0, target: 1 }) },
  { id: 'all_types',     icon: '🏆', name: 'Full Set',        desc: 'Own at least one of every upgrade type.',
    progress: s => ({ current: s.upgrades.filter(u => u.level > 0).length, target: s.upgrades.length }) },
  { id: 'click_power_10',icon: '💪', name: 'Strong Finger',   desc: 'Reach +10 per click.',
    progress: s => ({ current: Math.min(s.clickPower, 10), target: 10 }) },
  { id: 'per_sec_10',    icon: '🌊', name: 'Steady Stream',   desc: 'Reach +10 per second.',
    progress: s => ({ current: Math.min(s.autoPerSec, 10), target: 10 }) },
];

// Unlocked set is frozen: loaded once, written only when a new id is added,
// never re-derived from live game state and never cleared by game reset.
let unlockedAch = {};
try {
  const raw = safeGetItem(ACH_KEY);
  if (raw) unlockedAch = JSON.parse(raw) || {};
} catch (e) { unlockedAch = {}; }

function saveAchievements() { safeSetItem(ACH_KEY, JSON.stringify(unlockedAch)); }

// ---- Toast queue: each unlock shows for its full duration ----
const toastQueue = [];
let toastActive = false;
const TOAST_VISIBLE_MS = 2600;
const TOAST_GAP_MS = 250;

function enqueueToast(name) {
  toastQueue.push(name);
  if (!toastActive) processToastQueue();
}

function processToastQueue() {
  if (toastQueue.length === 0) {
    toastActive = false;
    return;
  }
  toastActive = true;
  const name = toastQueue.shift();

  let toast = document.getElementById('achToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'achToast';
    toast.className = 'ach-toast';
    document.body.appendChild(toast);
  }
  toast.textContent = '🏆 Achievement unlocked: ' + name;
  void toast.offsetWidth;
  toast.classList.add('show');

  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(processToastQueue, TOAST_GAP_MS);
  }, TOAST_VISIBLE_MS);
}

// Only ever ADDS to the unlocked set. Never removes, never re-derives.
function checkAchievements() {
  const newly = [];
  for (const a of ACHIEVEMENTS) {
    if (unlockedAch[a.id]) continue;
    const p = a.progress(state);
    if (p.current >= p.target) {
      unlockedAch[a.id] = true;
      newly.push(a.name);
    }
  }
  if (newly.length) {
    saveAchievements();
    newly.forEach(n => enqueueToast(n));
    renderAchievements();
  }
  updateAchBadge();
}

const achListEl = $('achList');
const achUnlockedCountEl = $('achUnlockedCount');
const achTotalCountEl = $('achTotalCount');
const achProgressFill = $('achProgressFill');
const achBadge = $('achBadge');
const achHeaderCount = $('achHeaderCount');

let achRowRefs = [];

function renderAchievements() {
  const total = ACHIEVEMENTS.length;
  let count = 0;
  achRowRefs = [];

  achListEl.innerHTML = '';
  for (const a of ACHIEVEMENTS) {
    const isUnlocked = !!unlockedAch[a.id];
    if (isUnlocked) count++;

    const div = document.createElement('div');
    div.className = 'ach ' + (isUnlocked ? 'unlocked' : 'locked');
    div.dataset.id = a.id;

    // Unlocked rows: no progress bar at all.
    let bodyHtml = `
      <div class="ach-top">
        <div class="icon">${a.icon}</div>
        <div class="info">
          <div class="name">${a.name}${isUnlocked ? ' <span class="badge">UNLOCKED</span>' : ''}</div>
          <div class="desc">${a.desc}</div>
        </div>
        <div class="status">${isUnlocked ? '✓' : '🔒'}</div>
      </div>`;

    let fill = null;
    let label = null;

    if (!isUnlocked) {
      const p = a.progress(state);
      const pct = p.target > 0 ? Math.min(100, (p.current / p.target) * 100) : 0;
      bodyHtml += `
        <div class="bar-wrap">
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
          <div class="bar-label">${fmt(p.current)}/${fmt(p.target)}</div>
        </div>`;
    }

    div.innerHTML = bodyHtml;
    achListEl.appendChild(div);

    if (!isUnlocked) {
      fill = div.querySelector('.bar .fill');
      label = div.querySelector('.bar-label');
    }

    achRowRefs.push({ id: a.id, unlocked: isUnlocked, fill, label });
  }

  achUnlockedCountEl.textContent = count;
  achTotalCountEl.textContent = total;
  achProgressFill.style.width = (total ? (count / total) * 100 : 0) + '%';
  updateAchBadge();
}

// Only updates rows that are still locked (unlocked rows have no bar).
function refreshAchievementProgress() {
  for (let i = 0; i < achRowRefs.length; i++) {
    const ref = achRowRefs[i];
    if (ref.unlocked) continue;
    const a = ACHIEVEMENTS.find(x => x.id === ref.id);
    if (!a) continue;
    const p = a.progress(state);
    const pct = p.target > 0 ? Math.min(100, (p.current / p.target) * 100) : 0;
    if (ref.fill) ref.fill.style.width = pct + '%';
    if (ref.label) ref.label.textContent = `${fmt(p.current)}/${fmt(p.target)}`;
  }
}

function updateAchBadge() {
  const count = ACHIEVEMENTS.filter(a => unlockedAch[a.id]).length;
  achBadge.textContent = count;
  achHeaderCount.textContent = count;
}

const achPanel = $('achPanel');
const achBackdrop = $('achBackdrop');
const achCloseBtn = $('achClose');
const achBtn = $('achBtn');
const wideQuery = window.matchMedia('(min-width: 900px)');

function isWide() { return wideQuery.matches; }

function openAchPanel() {
  if (isWide()) return;
  renderAchievements();
  achPanel.classList.add('open');
  achBackdrop.classList.add('open');
  achPanel.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeAchPanel() {
  achPanel.classList.remove('open');
  achBackdrop.classList.remove('open');
  document.body.style.overflow = '';
  if (isWide()) {
    achPanel.setAttribute('aria-hidden', 'false');
  } else {
    achPanel.setAttribute('aria-hidden', 'true');
  }
}

achBtn.addEventListener('click', openAchPanel);
achCloseBtn.addEventListener('click', closeAchPanel);
achBackdrop.addEventListener('click', closeAchPanel);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && achPanel.classList.contains('open')) closeAchPanel();
});

function syncPanelMode() {
  if (isWide()) {
    achPanel.classList.remove('open');
    achBackdrop.classList.remove('open');
    document.body.style.overflow = '';
    achPanel.setAttribute('aria-hidden', 'false');
    renderAchievements();
  } else {
    if (!achPanel.classList.contains('open')) {
      achPanel.setAttribute('aria-hidden', 'true');
    }
  }
}
if (wideQuery.addEventListener) wideQuery.addEventListener('change', syncPanelMode);
else if (wideQuery.addListener) wideQuery.addListener(syncPanelMode);

clickBtn.addEventListener('click', (e) => {
  state.score += state.clickPower;
  state.clickCount = (state.clickCount || 0) + 1;
  clickBtn.classList.remove('pulse');
  void clickBtn.offsetWidth;
  clickBtn.classList.add('pulse');

  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+' + state.clickPower;
  f.style.left = (e.clientX - 20) + 'px';
  f.style.top  = (e.clientY - 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);

  render();
  checkAchievements();
  refreshAchievementProgress();
});

function normalizeScore() {
  if (!Number.isFinite(state.score)) { state.score = 0; return; }
  if (state.score < 0) state.score = 0;
}

function tick() {
  const now = Date.now();
  const elapsed = (now - state.lastTick) / 1000;
  state.lastTick = now;

  if (state.autoPerSec > 0 && elapsed > 0) {
    state.score += state.autoPerSec * elapsed;
    normalizeScore();
    updateScoreDisplay();
    refreshUpgradeLocks();
    save();
    checkAchievements();
    refreshAchievementProgress();
  } else {
    updateScoreDisplay();
  }
}

function refreshUpgradeLocks() {
  const rows = listEl.children;
  for (let i = 0; i < rows.length; i++) {
    const id = rows[i].dataset.id;
    const u = state.upgrades.find(up => up.id === id);
    if (!u) continue;
    const affordable = state.score >= costOf(u);
    rows[i].classList.toggle('locked', !affordable);
  }
}

setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tick();
});

const resetBtn = $('resetBtn');
const modalBackdrop = $('modalBackdrop');
const modalCancel = $('modalCancel');
const modalConfirm = $('modalConfirm');

function openResetModal() {
  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  modalCancel.focus();
}
function closeResetModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  resetBtn.focus();
}

resetBtn.addEventListener('click', openResetModal);
modalCancel.addEventListener('click', closeResetModal);
modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) closeResetModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeResetModal();
});

modalConfirm.addEventListener('click', () => {
  closeResetModal();

  // Remove both saved state and achievements.
  safeRemoveItem(STORAGE_KEY);
  safeRemoveItem(ACH_KEY);

  // Reset game state.
  state.score = 0;
  state.clickPower = 1;
  state.autoPerSec = 0;
  state.clickCount = 0;
  state.hasReset = true;
  state.lastTick = Date.now();
  for (const u of state.upgrades) u.level = 0;

  // Clear unlocked achievements completely.
  unlockedAch = {};

  // Clear toast queue.
  toastQueue.length = 0;
  toastActive = false;

  render();
  renderAchievements();
  refreshAchievementProgress();
  checkAchievements();

  resetBtn.textContent = 'Reset! ✓';
  setTimeout(() => { resetBtn.textContent = 'Reset game'; }, 1200);
});

// Initial setup
renderAchievements();
syncPanelMode();
render();
checkAchievements();
refreshAchievementProgress();
</script>
</body>
</html>
