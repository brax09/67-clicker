<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>67 Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    user-select: none;
  }
  .stats {
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .score { font-size: 30px; font-weight: 800; color: #f9d423; }
  .per-click { font-size: 14px; opacity: 0.8; }
  .per-sec { font-size: 14px; opacity: 0.8; }

  #clickBtn {
    width: 260px;
    height: 260px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.07s ease;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  #clickBtn:active { transform: scale(0.94); }
  #clickBtn.pulse { animation: pulse 0.25s ease; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  #clickBtn .big67 {
    font-size: 200px;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -4px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: block;
    padding: 0 8px;
    user-select: none;
    pointer-events: none;
  }

  .shop {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .shop h2 { font-size: 18px; opacity: 0.85; margin-bottom: 2px; }
  #upgradeList { display: flex; flex-direction: column; gap: 10px; }

  .upgrade {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .upgrade:hover:not(.locked) { background: rgba(255,255,255,0.15); }
  .upgrade.locked { opacity: 0.45; cursor: not-allowed; }
  .upgrade .info { text-align: left; }
  .upgrade .name { font-weight: 700; }
  .upgrade .desc { font-size: 12px; opacity: 0.7; }
  .upgrade .cost { color: #f9d423; font-weight: 700; white-space: nowrap; }

  .reset {
    margin-top: 20px;
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.6);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .reset:hover { color: #fff; border-color: #fff; }

  .float {
    position: fixed;
    pointer-events: none;
    font-weight: 900;
    color: #f9d423;
    font-size: 24px;
    animation: floatUp 0.8s ease-out forwards;
    z-index: 999;
  }
  @keyframes floatUp {
    to { transform: translateY(-80px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="stats">
  <div>67s: <span class="score" id="score">0</span></div>
  <div class="per-click">+<span id="perClick">1</span> per click</div>
  <div class="per-sec">+<span id="perSec">0</span> per second</div>
</div>

<button id="clickBtn"><span class="big67">67</span></button>

<div class="shop">
  <h2>Upgrades</h2>
  <div id="upgradeList"></div>
</div>

<button class="reset" id="resetBtn">Reset game</button>

<script>
// ---- Game state ----
const state = {
  score: 0,
  clickPower: 1,
  upgrades: [
    { id: 'power',  name: 'Finger Strength', desc: '+1 per click',    baseCost: 10,  costMult: 1.25, level: 0 },
    { id: 'auto',   name: 'Auto-Clicker',    desc: '+1 per second',   baseCost: 50,  costMult: 1.30, level: 0 },
    { id: 'mega',   name: 'Mega 67',         desc: '+5 per click',    baseCost: 250, costMult: 1.35, level: 0 },
    { id: 'turbo',  name: 'Turbo Bot',       desc: '+5 per second',   baseCost: 1000,costMult: 1.40, level: 0 },
  ],
  autoPerSec: 0,
  // Track real elapsed time so background throttling can't cheat the player
  lastTick: Date.now(),
};

// ---- Load saved game ----
const saved = localStorage.getItem('clicker67');
if (saved) {
  try {
    const data = JSON.parse(saved);
    Object.assign(state, data);
    // Reset lastTick to "now" on load so we don't award offline time
    state.lastTick = Date.now();
  } catch (e) { console.warn('Save corrupted, starting fresh'); }
}

// ---- Helpers ----
const $ = (id) => document.getElementById(id);
const scoreEl = $('score');
const perClickEl = $('perClick');
const perSecEl = $('perSec');
const listEl = $('upgradeList');
const clickBtn = $('clickBtn');

const costOf = (u) => Math.floor(u.baseCost * Math.pow(u.costMult, u.level));
const fmt = (n) => n >= 1e6 ? (n/1e6).toFixed(2)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : Math.floor(n);

function recalc() {
  state.clickPower = 1
    + state.upgrades.find(u => u.id === 'power').level * 1
    + state.upgrades.find(u => u.id === 'mega').level * 5;
  state.autoPerSec =
      state.upgrades.find(u => u.id === 'auto').level * 1
    + state.upgrades.find(u => u.id === 'turbo').level * 5;
}

function render() {
  recalc();
  scoreEl.textContent = fmt(state.score);
  perClickEl.textContent = state.clickPower;
  perSecEl.textContent = state.autoPerSec;

  listEl.innerHTML = '';
  for (const u of state.upgrades) {
    const cost = costOf(u);
    const affordable = state.score >= cost;
    const div = document.createElement('div');
    div.className = 'upgrade' + (affordable ? '' : ' locked');
    div.innerHTML = `
      <div class="info">
        <div class="name">${u.name} <span style="opacity:.6">Lv.${u.level}</span></div>
        <div class="desc">${u.desc}</div>
      </div>
      <div class="cost">${fmt(cost)}</div>`;
    div.onclick = () => buy(u);
    listEl.appendChild(div);
  }

  save();
}

function buy(u) {
  const cost = costOf(u);
  if (state.score < cost) return;
  state.score -= cost;
  u.level++;
  render();
}

function save() {
  localStorage.setItem('clicker67', JSON.stringify(state));
}

// ---- Clicking ----
clickBtn.addEventListener('click', (e) => {
  state.score += state.clickPower;
  clickBtn.classList.remove('pulse');
  void clickBtn.offsetWidth;
  clickBtn.classList.add('pulse');

  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+' + state.clickPower;
  f.style.left = (e.clientX - 20) + 'px';
  f.style.top  = (e.clientY - 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);

  render();
});

// ---- Real-time auto income (throttle-proof) ----
// Award income based on REAL elapsed time, not per interval tick, so the
// 67s-per-second rate stays exactly equal to autoPerSec even when the browser
// throttles timers in a background tab.
function tick() {
  const now = Date.now();
  const elapsed = (now - state.lastTick) / 1000; // real seconds elapsed
  state.lastTick = now;

  if (state.autoPerSec > 0 && elapsed > 0) {
    state.score += state.autoPerSec * elapsed;
    render();
  }
}
setInterval(tick, 1000);
// Catch up immediately when the tab becomes visible again
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tick();
});

// ---- Reset (fully working) ----
const resetBtn = $('resetBtn');
resetBtn.addEventListener('click', () => {
  const ok = confirm('Reset all progress? This cannot be undone.');
  if (!ok) return;
  localStorage.removeItem('clicker67');
  state.score = 0;
  state.clickPower = 1;
  state.autoPerSec = 0;
  state.lastTick = Date.now();
  for (const u of state.upgrades) u.level = 0;
  render();
  resetBtn.textContent = 'Reset! ✓';
  setTimeout(() => { resetBtn.textContent = 'Reset game'; }, 1200);
});

render();
</script>
</body>
</html>
