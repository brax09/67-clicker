<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>67 Clicker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1a2e, #16213e 60%, #0f3460);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    user-select: none;
    -webkit-user-select: none;
    overflow-y: auto;
    position: relative;
  }

  .stats {
    text-align: center;
    margin-bottom: clamp(10px, 3vw, 18px);
    line-height: 1.6;
  }
  .score { font-size: clamp(24px, 7vw, 30px); font-weight: 800; color: #f9d423; }
  .per-click { font-size: 14px; opacity: 0.8; }
  .per-sec { font-size: 14px; opacity: 0.8; }

  #clickBtn {
    width: clamp(160px, 48vw, 260px);
    height: clamp(160px, 48vw, 260px);
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    transition: transform 0.07s ease;
    margin-bottom: clamp(16px, 5vw, 28px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #clickBtn:active { transform: scale(0.94); }
  #clickBtn.pulse { animation: pulse 0.25s ease; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  #clickBtn .big67 {
    font-size: clamp(110px, 34vw, 200px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -4px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: block;
    padding: 0 8px;
    user-select: none;
    pointer-events: none;
  }

  .shop {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 8px;
  }
  .shop h2 { font-size: 18px; opacity: 0.85; margin-bottom: 2px; }
  #upgradeList { display: flex; flex-direction: column; gap: 10px; }

  .upgrade {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .upgrade:hover:not(.locked) { background: rgba(255,255,255,0.15); }
  .upgrade.locked { opacity: 0.45; cursor: not-allowed; }
  .upgrade .info { text-align: left; }
  .upgrade .name { font-weight: 700; }
  .upgrade .desc { font-size: 12px; opacity: 0.7; }
  .upgrade .cost { color: #f9d423; font-weight: 700; white-space: nowrap; }

  .reset {
    margin-top: 20px;
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.6);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .reset:hover { color: #fff; border-color: #fff; }

  .float {
    position: fixed;
    pointer-events: none;
    font-weight: 900;
    color: #f9d423;
    font-size: 24px;
    animation: floatUp 0.8s ease-out forwards;
    z-index: 999;
  }
  @keyframes floatUp {
    to { transform: translateY(-80px); opacity: 0; }
  }

  /* Custom reset modal (replaces blocking confirm()) */
  #modalBackdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #modalBackdrop.open { display: flex; }
  .modal {
    background: linear-gradient(160deg, #1f2544, #16213e);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    padding: 24px 20px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .modal p { margin-bottom: 20px; font-size: 15px; line-height: 1.5; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; }
  .modal button {
    flex: 1;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.25);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .modal .cancel { background: rgba(255,255,255,0.08); color: #fff; }
  .modal .confirm { background: #c0392b; color: #fff; border-color: #e74c3c; }
  .modal .cancel:hover { background: rgba(255,255,255,0.16); }
  .modal .confirm:hover { background: #d64535; }

  @media (prefers-reduced-motion: reduce) {
    #clickBtn.pulse { animation: none; }
    .float { animation-duration: 0.01s; }
  }
</style>
</head>
<body>

<div class="stats">
  <div>67s: <span class="score" id="score">0</span></div>
  <div class="per-click">+<span id="perClick">1</span> per click</div>
  <div class="per-sec">+<span id="perSec">0</span> per second</div>
</div>

<button id="clickBtn"><span class="big67">67</span></button>

<div class="shop">
  <h2>Upgrades</h2>
  <div id="upgradeList"></div>
</div>

<button class="reset" id="resetBtn">Reset game</button>

<!-- Custom reset confirmation modal -->
<div id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalText">
    <p id="modalText">Reset all progress? This cannot be undone.</p>
    <div class="actions">
      <button class="cancel" id="modalCancel">Cancel</button>
      <button class="confirm" id="modalConfirm">Reset</button>
    </div>
  </div>
</div>

<script>
// ---- Game state ----
const state = {
  score: 0,
  clickPower: 1,
  upgrades: [
    { id: 'power',  name: 'Finger Strength', desc: '+1 per click',    baseCost: 10,  costMult: 1.12, level: 0 },
    { id: 'auto',   name: 'Auto-Clicker',    desc: '+1 per second',   baseCost: 25,  costMult: 1.15, level: 0 },
    { id: 'mega',   name: 'Mega 67',         desc: '+5 per click',    baseCost: 60,  costMult: 1.18, level: 0 },
    { id: 'turbo',  name: 'Turbo Bot',       desc: '+5 per second',   baseCost: 150, costMult: 1.20, level: 0 },
  ],
  autoPerSec: 0,
  lastTick: Date.now(),
};

// ---- Safe localStorage helpers (fix #5) ----
const STORAGE_KEY = 'clicker67';
let storageAvailable = true;

function safeGetItem(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    storageAvailable = false;
    console.warn('localStorage unavailable, progress will not save.');
    return null;
  }
}

function safeSetItem(key, value) {
  if (!storageAvailable) return false;
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    storageAvailable = false;
    console.warn('Could not save progress (storage full or blocked).');
    return false;
  }
}

function safeRemoveItem(key) {
  if (!storageAvailable) return;
  try {
    localStorage.removeItem(key);
  } catch (e) {
    // ignore
  }
}

// ---- Load saved game with defensive structural merge (fix #6) ----
const saved = safeGetItem(STORAGE_KEY);
if (saved) {
  try {
    const data = JSON.parse(saved);
    if (data && typeof data === 'object') {
      // Restore top-level numeric fields only if they are valid finite numbers.
      if (Number.isFinite(data.score) && data.score >= 0) state.score = data.score;
      if (Number.isFinite(data.clickPower) && data.clickPower > 0) state.clickPower = data.clickPower;
      if (Number.isFinite(data.autoPerSec) && data.autoPerSec >= 0) state.autoPerSec = data.autoPerSec;

      // Merge saved upgrade levels/costMult onto the current upgrade definitions
      // by id, so structural changes between versions can't corrupt the game.
      if (Array.isArray(data.upgrades)) {
        for (const savedUp of data.upgrades) {
          if (!savedUp || typeof savedUp.id !== 'string') continue;
          const target = state.upgrades.find(u => u.id === savedUp.id);
          if (!target) continue; // upgrade no longer exists — skip safely
          if (Number.isFinite(savedUp.level) && savedUp.level >= 0) {
            target.level = Math.floor(savedUp.level);
          }
          // Apply the balanced costMult for known upgrades (migration from older saves).
          const balanced = { power: 1.12, auto: 1.15, mega: 1.18, turbo: 1.20 };
          if (balanced[target.id] !== undefined) target.costMult = balanced[target.id];
        }
      }
    }
    // Reset lastTick so no offline time is awarded on load.
    state.lastTick = Date.now();
  } catch (e) {
    console.warn('Save corrupted, starting fresh');
  }
}

// Sanitize score in case of corrupted/NaN save (fix #13)
if (!Number.isFinite(state.score) || state.score < 0) state.score = 0;
if (!Number.isFinite(state.clickPower) || state.clickPower <= 0) state.clickPower = 1;

// ---- Helpers ----
const $ = (id) => document.getElementById(id);
const scoreEl = $('score');
const perClickEl = $('perClick');
const perSecEl = $('perSec');
const listEl = $('upgradeList');
const clickBtn = $('clickBtn');

const costOf = (u) => Math.floor(u.baseCost * Math.pow(u.costMult, u.level));

// Guard against NaN/Infinity so the display never breaks (fix #13)
const fmt = (n) => {
  if (!Number.isFinite(n)) return '0';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return Math.floor(n);
};

function recalc() {
  state.clickPower = 1
    + state.upgrades.find(u => u.id === 'power').level * 1
    + state.upgrades.find(u => u.id === 'mega').level * 5;
  state.autoPerSec =
      state.upgrades.find(u => u.id === 'auto').level * 1
    + state.upgrades.find(u => u.id === 'turbo').level * 5;
}

// Full render: rebuilds stats + shop.
function render() {
  recalc();
  scoreEl.textContent = fmt(state.score);
  perClickEl.textContent = state.clickPower;
  perSecEl.textContent = state.autoPerSec;

  listEl.innerHTML = '';
  for (const u of state.upgrades) {
    const cost = costOf(u);
    const affordable = state.score >= cost;
    const div = document.createElement('div');
    div.className = 'upgrade' + (affordable ? '' : ' locked');
    // Stamp each row with its id so lock updates never rely on DOM order (fix #1)
    div.dataset.id = u.id;
    div.innerHTML = `
      <div class="info">
        <div class="name">${u.name} <span style="opacity:.6">Lv.${u.level}</span></div>
        <div class="desc">${u.desc}</div>
      </div>
      <div class="cost">${fmt(cost)}</div>`;
    div.onclick = () => buy(u);
    listEl.appendChild(div);
  }

  save();
}

// Lightweight score-only update for the per-second tick.
function updateScoreDisplay() {
  scoreEl.textContent = fmt(state.score);
}

function buy(u) {
  const cost = costOf(u);
  if (state.score < cost) return;
  state.score -= cost;
  u.level++;
  render();
}

// ---- Throttled save (fix #4) ----
// Auto income calls render()/updateScoreDisplay() frequently; writing to
// localStorage every second is expensive. We debounce writes and also flush
// on important lifecycle events.
let saveTimer = null;
const SAVE_THROTTLE_MS = 5000;

function saveNow() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  safeSetItem(STORAGE_KEY, JSON.stringify(state));
}

function save() {
  // If a save is already queued, don't queue another.
  if (saveTimer) return;
  saveTimer = setTimeout(() => {
    saveTimer = null;
    safeSetItem(STORAGE_KEY, JSON.stringify(state));
  }, SAVE_THROTTLE_MS);
}

// Flush pending saves when leaving / hiding the page.
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) saveNow();
});

// ---- Clicking ----
clickBtn.addEventListener('click', (e) => {
  state.score += state.clickPower;
  clickBtn.classList.remove('pulse');
  void clickBtn.offsetWidth;
  clickBtn.classList.add('pulse');

  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = '+' + state.clickPower;
  f.style.left = (e.clientX - 20) + 'px';
  f.style.top  = (e.clientY - 20) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);

  render();
});

// ---- Real-time auto income (updates every second) ----
// Normalize fractional score to keep the display and stored value consistent (fix #14).
function normalizeScore() {
  if (!Number.isFinite(state.score)) { state.score = 0; return; }
  // Keep fractional precision internally but never let it go negative.
  if (state.score < 0) state.score = 0;
}

function tick() {
  const now = Date.now();
  const elapsed = (now - state.lastTick) / 1000;
  state.lastTick = now;

  if (state.autoPerSec > 0 && elapsed > 0) {
    state.score += state.autoPerSec * elapsed;
    normalizeScore();
    updateScoreDisplay();
    refreshUpgradeLocks();
    save();
  } else {
    updateScoreDisplay();
  }
}

// Toggle locked/unlocked styling by matching upgrade id, not DOM index (fix #1).
function refreshUpgradeLocks() {
  const rows = listEl.children;
  for (let i = 0; i < rows.length; i++) {
    const id = rows[i].dataset.id;
    const u = state.upgrades.find(up => up.id === id);
    if (!u) continue;
    const affordable = state.score >= costOf(u);
    rows[i].classList.toggle('locked', !affordable);
  }
}

setInterval(tick, 1000);
// Catch up immediately when the tab becomes visible again (fix #10 — display
// also refreshes on return, and elapsed-time math keeps the income exact).
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) tick();
});

// ---- Reset via custom modal (fix #12) ----
const resetBtn = $('resetBtn');
const modalBackdrop = $('modalBackdrop');
const modalCancel = $('modalCancel');
const modalConfirm = $('modalConfirm');

function openResetModal() {
  modalBackdrop.classList.add('open');
  modalBackdrop.setAttribute('aria-hidden', 'false');
  modalCancel.focus();
}

function closeResetModal() {
  modalBackdrop.classList.remove('open');
  modalBackdrop.setAttribute('aria-hidden', 'true');
  resetBtn.focus();
}

resetBtn.addEventListener('click', openResetModal);
modalCancel.addEventListener('click', closeResetModal);
modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) closeResetModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalBackdrop.classList.contains('open')) closeResetModal();
});

modalConfirm.addEventListener('click', () => {
  closeResetModal();
  safeRemoveItem(STORAGE_KEY);
  state.score = 0;
  state.clickPower = 1;
  state.autoPerSec = 0;
  state.lastTick = Date.now();
  for (const u of state.upgrades) u.level = 0;
  render();
  resetBtn.textContent = 'Reset! ✓';
  setTimeout(() => { resetBtn.textContent = 'Reset game'; }, 1200);
});

render();
</script>
</body>
</html>
